<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qwen3 bbox 直接测试</title>
    <link rel="stylesheet" href="/static/qwen_debug.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">QWEN3-VL DIRECT REQUEST</p>
          <h1>Qwen3 bbox 直接测试</h1>
          <p>粘贴图片和 Prompt，绕过 Locate、SKU 与 SAM3，直接查看 Qwen3 输出。</p>
        </div>
        <a href="/">返回 Locate Debug</a>
      </header>

      <section class="controls">
        <label class="prompt">
          <span>Prompt</span>
          <textarea id="prompt" rows="9" placeholder='只返回JSON：{"name":"目标","bbox":[x1,y1,x2,y2]}'></textarea>
        </label>
        <div class="image-input">
          <span>测试图片</span>
          <button id="pasteZone" type="button">点击这里后按 Ctrl+V 粘贴图片</button>
          <label class="file-button">或选择图片<input id="fileInput" type="file" accept="image/*" /></label>
          <small id="imageStatus">尚未载入图片</small>
        </div>
        <label class="temperature">temperature
          <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.5" />
        </label>
        <label class="coordinate">bbox 坐标
          <select id="coordinateMode">
            <option value="normalized">0–1000 归一化</option>
            <option value="pixel">原图像素</option>
          </select>
        </label>
        <button id="run" class="run" type="button">请求 Qwen3 并绘制 bbox</button>
        <span id="requestStatus"></span>
      </section>

      <section class="results">
        <article class="viewer">
          <h2>检测结果</h2>
          <div class="canvas-wrap">
            <canvas id="canvas"></canvas>
            <span id="empty">请先粘贴图片</span>
          </div>
        </article>
        <article class="output">
          <h2>实际发送的 Prompt</h2>
          <pre id="promptUsed">等待请求</pre>
          <h2>解析后的 bbox</h2>
          <pre id="detections">[]</pre>
          <h2>Qwen3 原始输出</h2>
          <pre id="rawOutput">等待请求</pre>
        </article>
      </section>
    </main>
    <script src="/static/qwen_debug.js"></script>
  </body>
</html>
