[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-recognizer"
version = "0.1.0"
description = "A minimal Qwen3-VL receipt recognizer for an OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "pillow>=10",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.7",
]

[project.scripts]
receipt-recognizer = "receipt_recognizer.cli:main"
receipt-evaluate = "receipt_recognizer.evaluation:main"
receipt-ocr = "receipt_recognizer.ocr:main"
qwen-probe = "receipt_recognizer.probe:main"

[tool.setuptools.packages.find]
include = ["receipt_recognizer*"]
