# Agent 直接依赖的基础能力和 8086 取放编排服务地址。当前使用本机回环地址和独立端口；
# 跨主机实机联调时应替换成各模块实际监听地址。
services:
  navigation: http://127.0.0.1:8101
  perception: http://127.0.0.1:8102
  pose: http://127.0.0.1:8103
  manipulation: http://127.0.0.1:8104
  pick_place: http://127.0.0.1:8106
  sku: http://127.0.0.1:8107

# 巡检导航点的数量、名称和顺序均可按现场修改，但至少一个且不能重复。
# 第一轮按列表从上到下，第二轮从下到上；第二轮首点只识别，不重复导航和位姿。
inspection_points:
  - H1_F_INSPECT
  - H1_B_INSPECT
  - H2_F_INSPECT
  - H2_B_INSPECT

# Mock 动作超时覆盖 random-delay 场景的 5-10 秒随机处理时间；超时测试场景
# 使用超过该阈值的导航延迟。实机运行请使用 config/agent.production.yaml。
timeouts:
  connect_seconds: 1
  health_seconds: 1
  sku_seconds: 2
  receipt_seconds: 12
  inspection_seconds: 12
  navigation_seconds: 12
  pose_seconds: 12
  pick_seconds: 12
  place_seconds: 12

# 标准商品摆放表。键是 H(货架)_F/B(面)_L(层)_C(列) 格式的货位编号。
# product_name 传给抓放模块；route_order 决定商品拣选任务的取货先后且必须唯一。
product_slots:
  H1_F_L1_C01:
    product_name: 可口可乐
    route_order: 1
  H1_F_L1_C02:
    product_name: 矿泉水
    route_order: 2
  H1_F_L2_C01:
    product_name: 薯片
    route_order: 3
  H2_B_L3_C02:
    product_name: 牛奶
    route_order: 4
