# Web service listener.
server:
  host: 0.0.0.0
  port: 8090

# Downstream service endpoints used by the web proxy.
services:
  pick_url: http://127.0.0.1:8086/pick
  place_url: http://127.0.0.1:8086/place
  task1_url: http://127.0.0.1:8108/task1/run
  locate_url: http://127.0.0.1:8083/perception/pick/locate
  perception_url: http://127.0.0.1:8083
  navigation_url: http://192.168.3.226:8081
  pose_url: http://192.168.3.226:8084

request_timeout_seconds: 900

# Relative paths are resolved from this file's directory.
paths:
  log_dir: ../log
  locate_image_roots:
    - /data/T-Mates-Grocery
    - /tmp
